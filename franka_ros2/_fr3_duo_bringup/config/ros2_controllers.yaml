# ros2_control for the FR3 duo + Robotiq: one trajectory controller per arm and per gripper.
# Used with mock_components in the RViz test (rviz_mock.launch.py).
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints: [left_fr3v2_joint1, left_fr3v2_joint2, left_fr3v2_joint3, left_fr3v2_joint4,
             left_fr3v2_joint5, left_fr3v2_joint6, left_fr3v2_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: false

right_arm_controller:
  ros__parameters:
    joints: [right_fr3v2_joint1, right_fr3v2_joint2, right_fr3v2_joint3, right_fr3v2_joint4,
             right_fr3v2_joint5, right_fr3v2_joint6, right_fr3v2_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: false

left_gripper_controller:
  ros__parameters:
    joints: [left_robotiq_85_left_knuckle_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

right_gripper_controller:
  ros__parameters:
    joints: [right_robotiq_85_left_knuckle_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
